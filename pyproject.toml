[project]
name = "hammer-watch2-re"
version = "0.1.0"
description = "Offline, evidence-led HAMMER Watch 2 inspection toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
installer = ["cryptography==50.0.2"]
android = ["androguard==4.1.3"]
images = ["lz4==4.4.5", "Pillow==13.0.0"]
radio = ["bumble[android]==0.0.236"]
aot = ["pyelftools==0.32", "requests==2.32.5"]

[project.scripts]
hammer-re = "tools.hammer_re:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]
